<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="LifeVault">
  <title>LifeVault</title>
  <defs>
    <linearGradient id="lv-shield" x1="64" y1="6" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A88B5"/>
      <stop offset="0.45" stop-color="#123554"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="lv-pulse" x1="26" y1="66" x2="102" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="lv-ring" x1="0" y1="34" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="lv-glow" cx="64" cy="66" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield plate -->
  <path d="M26 14 H102 C109 14 114 19 114 26 V62 C114 90 94 109 64 119 C34 109 14 90 14 62 V26 C14 19 19 14 26 14 Z"
        fill="url(#lv-shield)" stroke="#67E8F9" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Soft top shine -->
  <path d="M26 14 H102 C109 14 114 19 114 26 V44 C92 33 36 33 14 41 V26 C14 19 19 14 26 14 Z"
        fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Inner bevel -->
  <path d="M30 21 H98 C103.5 21 107 24.5 107 29.5 V61 C107 85.5 89 102.5 64 111.5 C39 102.5 21 85.5 21 61 V29.5 C21 24.5 24.5 21 30 21 Z"
        fill="none" stroke="#67E8F9" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Dial glow -->
  <circle cx="64" cy="66" r="44" fill="url(#lv-glow)"/>

  <!-- Combination-dial ring, opened left + right for the pulse -->
  <path d="M91.58 74.96 A29 29 0 0 1 36.42 74.96" fill="none" stroke="url(#lv-ring)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M36.42 57.04 A29 29 0 0 1 91.58 57.04" fill="none" stroke="url(#lv-ring)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Combination-dial scale (open left + right where the lifeline passes) -->
  <g stroke="#67E8F9" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="95.86" y1="76.35" x2="100.62" y2="77.90"/>
    <line x1="91.10" y1="85.69" x2="95.15" y2="88.63"/>
    <line x1="83.69" y1="93.10" x2="86.63" y2="97.15"/>
    <line x1="74.35" y1="97.86" x2="75.90" y2="102.62"/>
    <line x1="64" y1="99.5" x2="64" y2="104.5"/>
    <line x1="53.65" y1="97.86" x2="52.10" y2="102.62"/>
    <line x1="44.31" y1="93.10" x2="41.37" y2="97.15"/>
    <line x1="36.90" y1="85.69" x2="32.85" y2="88.63"/>
    <line x1="32.14" y1="76.35" x2="27.38" y2="77.90"/>
    <line x1="32.14" y1="55.65" x2="27.38" y2="54.10"/>
    <line x1="36.90" y1="46.31" x2="32.85" y2="43.37"/>
    <line x1="44.31" y1="38.90" x2="41.37" y2="34.85"/>
    <line x1="53.65" y1="34.14" x2="52.10" y2="29.38"/>
    <line x1="64" y1="32.5" x2="64" y2="27.5"/>
    <line x1="74.35" y1="34.14" x2="75.90" y2="29.38"/>
    <line x1="83.69" y1="38.90" x2="86.63" y2="34.85"/>
    <line x1="91.10" y1="46.31" x2="95.15" y2="43.37"/>
    <line x1="95.86" y1="55.65" x2="100.62" y2="54.10"/>
  </g>

  <!-- Lifeline: enters, spikes, leaves through the ring gaps -->
  <path d="M26 66 L47 66 L53 75 L59.5 43 L67.5 79 L74 66 L102 66"
        fill="none" stroke="url(#lv-pulse)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
